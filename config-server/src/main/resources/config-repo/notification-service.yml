server:
  port: 8085

spring:
  application:
    name: notification-service
  datasource:
    url: jdbc:mysql://mysql:3306/civil_engineer_notifications?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${NOTIFICATION_DB_USERNAME:civil_user}
    password: ${NOTIFICATION_DB_PASSWORD:civil_pass}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    placeholder-replacement: false
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: 587
    username: ${SMTP_USERNAME:placeholder@gmail.com}
    password: ${SMTP_PASSWORD:placeholder}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    consumer:
      group-id: notification-service-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.civileng.marketplace.*
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: 6379
      timeout: 2000ms
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: 5672
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}

app:
  sms:
    provider: twilio
    twilio:
      account-sid: ${TWILIO_ACCOUNT_SID:placeholder}
      auth-token: ${TWILIO_AUTH_TOKEN:placeholder}
      phone-number: ${TWILIO_PHONE_NUMBER:+1234567890}
  push:
    firebase:
      config-path: /etc/config/firebase-service-account.json
  email:
    from-address: noreply@civilengineer.com
    from-name: Civil Engineer Marketplace
    templates:
      otp: otp-template
      welcome: welcome-template
      booking-confirmed: booking-confirmed-template
      payment-received: payment-received-template

eureka:
  instance:
    prefer-ip-address: true
    hostname: notification-service
  client:
    service-url:
      defaultZone: http://service-registry:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
