server:
  port: 8092

spring:
  application:
    name: search-service
  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://elasticsearch:9200}
    connection-timeout: 5s
    socket-timeout: 10s

resilience4j:
  circuitbreaker:
    instances:
      default:
        register-health-indicator: true
        sliding-window-size: 10
        minimum-number-of-calls: 5
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        wait-duration-in-open-state: 5s
        failure-rate-threshold: 50

search:
  # Full reindex cadence. The index is a read replica of user/auth/review data; there are no
  # change events to consume yet, so a periodic pull keeps it fresh (SRS CP-02 allows < 60s lag,
  # which this does not meet — wire event-driven updates when the services publish them).
  reindex-cron: "0 */5 * * * *"
  reindex-on-startup: true

eureka:
  instance:
    prefer-ip-address: true
    hostname: search-service
  client:
    service-url:
      defaultZone: http://service-registry:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
