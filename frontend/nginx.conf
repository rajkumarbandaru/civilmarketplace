server {
    listen 3000;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # index.html must never be cached.
    #
    # It is the only file with a stable URL, and it is what names the hashed bundles. A browser
    # holding yesterday's copy keeps requesting yesterday's chunks — which still exist, so nothing
    # errors and the app simply stays on the old version after a deploy, indefinitely and
    # invisibly. Everything else is content-hashed, so correctness here costs one small request.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        expires -1;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite emits content-hashed files to /assets, not /static — the old rule here pointed at a
    # directory this build has never produced, so nothing was ever cached long-term.
    # A new build means a new filename, so these are safe to pin forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
