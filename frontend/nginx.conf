server {
    listen 3000;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # index.html must never be cached.
    #
    # It is the only file with a stable URL, and it is what names the hashed bundles. A browser
    # holding yesterday's copy keeps requesting yesterday's chunks — which still exist, so nothing
    # errors and the app simply stays on the old version after a deploy, indefinitely and
    # invisibly. Everything else is content-hashed, so correctness here costs one small request.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        expires -1;
    }

    # The API, same-origin.
    #
    # This is what makes multi-tenancy work in a browser. The gateway resolves which tenant a
    # request belongs to from the Host header, so a bundle that calls http://localhost:8080
    # directly sends every tenant's traffic under the hostname "localhost" — and they all land on
    # whatever platform.tenant.fallback names, whichever subdomain the operator actually opened.
    # Proxying here keeps the browser's own host on the request, so acme.localhost:3000 reaches
    # the gateway as acme and hostelfee.localhost:3000 reaches it as hostelfee.
    location /api/ {
        proxy_pass http://api-gateway:8080;
        proxy_http_version 1.1;

        # The header the whole tenancy scheme turns on. $http_host keeps the port the browser
        # actually used, which matters twice: the gateway strips the port before resolving the
        # tenant, so nothing is lost there — and keeping it makes the request URL match the
        # browser's Origin exactly, so Spring treats these as same-origin and never runs a CORS
        # check on them at all. With a bare $host the ports differ, every call is judged
        # cross-origin, and an unlisted tenant hostname comes back as a bare 403.
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Server-sent events and websocket upgrades used by tracking and notifications.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite emits content-hashed files to /assets, not /static — the old rule here pointed at a
    # directory this build has never produced, so nothing was ever cached long-term.
    # A new build means a new filename, so these are safe to pin forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
