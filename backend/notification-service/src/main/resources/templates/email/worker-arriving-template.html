<!DOCTYPE html>
<!--/*
  "Your professional is nearly here."

  Sent once, when the worker is within a kilometre or about five minutes out. The wording changes
  with `trafficAware`: a routed ETA can be stated as a time, while the fallback estimate is offered
  as an approximation — a customer who goes downstairs on a guess presented as a promise is worse
  served than one who was told it was a guess.
*/-->
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{email/_layout :: page(~{::content})}">
<body>
<div th:fragment="content" th:remove="tag">
    <h1 style="margin:0 0 12px; font-size:20px; color:#1f2933;">
        Your professional is on the way
    </h1>

    <p style="margin:0 0 16px; font-size:14px; line-height:22px; color:#3e4c59;">
        Hi <span th:text="${name}">there</span>,
        <span th:if="${workerName != null and !workerName.isEmpty()}">
            <span th:text="${workerName}">Your professional</span>
        </span>
        <span th:unless="${workerName != null and !workerName.isEmpty()}">your professional</span>
        is nearly at your address for <span th:text="${serviceName}">your booking</span>.
    </p>

    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
           style="margin:0 0 16px; background-color:#e6f4ea; border-radius:6px;">
        <tr>
            <td align="center" style="padding:18px;">
                <div style="font-size:28px; font-weight:bold; color:#1e7a3c;"
                     th:text="${etaMinutes} + ' min'">5 min</div>
                <div style="font-size:13px; color:#3e4c59; padding-top:4px;"
                     th:text="${trafficAware}
                              ? 'Estimated arrival, based on current traffic'
                              : 'Approximate arrival — traffic conditions are not available'">
                    Estimated arrival
                </div>
                <div style="font-size:13px; color:#7b8794; padding-top:4px;"
                     th:text="'About ' + ${distanceKm} + ' km away'">About 1 km away</div>
            </td>
        </tr>
    </table>

    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
           style="margin:0 0 16px; background-color:#f0f4f8; border-radius:6px;">
        <tr th:if="${addressLine != null and !addressLine.isEmpty()}">
            <td style="padding:12px 18px; font-size:14px; color:#7b8794;">Arriving at</td>
            <td style="padding:12px 18px; font-size:14px; color:#1f2933;" align="right"
                th:text="${addressLine}">Address</td>
        </tr>
        <tr>
            <td style="padding:12px 18px; font-size:14px; color:#7b8794;">Booking reference</td>
            <td style="padding:12px 18px; font-size:14px; font-weight:bold; color:#0b5394;" align="right"
                th:text="${bookingCode}">BK-0000</td>
        </tr>
    </table>

    <p style="margin:0;">
        <a th:href="${trackUrl}" href="#"
           style="display:inline-block; background-color:#0b5394; color:#ffffff; text-decoration:none;
                  padding:11px 22px; border-radius:6px; font-size:14px; font-weight:bold;">
            Track live location
        </a>
    </p>
</div>
</body>
</html>
