<!DOCTYPE html>
<!--/*
  Shared chrome for every transactional email.

  Styling is inline and table-based on purpose: Gmail, Outlook and most mobile clients strip
  <style> blocks and ignore flex/grid, so anything structural has to live on the elements.
*/-->
<html xmlns:th="http://www.thymeleaf.org" th:fragment="page(content)">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${title} ?: 'Civil Engineering Marketplace'">Civil Engineering Marketplace</title>
</head>
<body style="margin:0; padding:0; background-color:#f4f6f8; font-family:Arial, Helvetica, sans-serif; color:#1f2933;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f4f6f8; padding:24px 12px;">
    <tr>
        <td align="center">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
                   style="max-width:600px; background-color:#ffffff; border-radius:8px; overflow:hidden; border:1px solid #e4e7eb;">
                <tr>
                    <td style="background-color:#0b5394; padding:20px 28px;">
                        <span style="color:#ffffff; font-size:18px; font-weight:bold; letter-spacing:0.3px;">
                            Civil Engineering Marketplace
                        </span>
                    </td>
                </tr>
                <tr>
                    <td style="padding:28px;">
                        <div th:replace="${content}">Message body goes here.</div>
                    </td>
                </tr>
                <tr>
                    <td style="background-color:#f9fafb; padding:18px 28px; border-top:1px solid #e4e7eb;">
                        <p style="margin:0; font-size:12px; line-height:18px; color:#7b8794;">
                            This is an automated message from Civil Engineering Marketplace.
                            Please do not reply to this email.
                        </p>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
