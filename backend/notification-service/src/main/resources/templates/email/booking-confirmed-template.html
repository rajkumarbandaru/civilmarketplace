<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{email/_layout :: page(~{::content})}">
<body>
<div th:fragment="content" th:remove="tag">
    <h1 style="margin:0 0 12px; font-size:20px; color:#1f2933;">Booking confirmed</h1>
    <p style="margin:0 0 16px; font-size:14px; line-height:22px; color:#3e4c59;">
        Hi <span th:text="${name}">there</span>, your booking has been confirmed.
    </p>
    <table role="presentation" cellpadding="0" cellspacing="0" border="0"
           style="margin:0 0 16px; background-color:#f0f4f8; border-radius:6px;">
        <tr>
            <td style="padding:14px 18px; font-size:14px; color:#3e4c59;">
                Booking reference:
                <strong style="color:#0b5394;" th:text="${bookingCode}">BKG-0000</strong>
            </td>
        </tr>
    </table>
    <p style="margin:0; font-size:14px; line-height:22px; color:#3e4c59;">
        You can track the status of this booking from your dashboard at any time.
    </p>
</div>
</body>
</html>
