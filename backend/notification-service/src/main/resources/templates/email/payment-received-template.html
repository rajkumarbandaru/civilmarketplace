<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{email/_layout :: page(~{::content})}">
<body>
<div th:fragment="content" th:remove="tag">
    <h1 style="margin:0 0 12px; font-size:20px; color:#1f2933;">Payment received</h1>
    <p style="margin:0 0 16px; font-size:14px; line-height:22px; color:#3e4c59;">
        Hi <span th:text="${name}">there</span>, we have received your payment. Thank you.
    </p>
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
           style="margin:0 0 16px; background-color:#f0f4f8; border-radius:6px;">
        <tr>
            <td style="padding:12px 18px; font-size:14px; color:#7b8794;">Amount</td>
            <td style="padding:12px 18px; font-size:14px; font-weight:bold; color:#1f2933;" align="right"
                th:text="${amount}">0.00</td>
        </tr>
        <tr>
            <td style="padding:12px 18px; font-size:14px; color:#7b8794;">Reference</td>
            <td style="padding:12px 18px; font-size:14px; font-weight:bold; color:#0b5394;" align="right"
                th:text="${paymentCode}">PAY-0000</td>
        </tr>
    </table>
    <p style="margin:0; font-size:13px; line-height:20px; color:#7b8794;">
        Keep this email as your receipt.
    </p>
</div>
</body>
</html>
