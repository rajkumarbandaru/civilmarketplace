<!DOCTYPE html>
<!-- Generic body used by the multi-channel dispatcher for notifications with no dedicated template. -->
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{email/_layout :: page(~{::content})}">
<body>
<div th:fragment="content" th:remove="tag">
    <h1 style="margin:0 0 12px; font-size:20px; color:#1f2933;" th:text="${title}">Notification</h1>
    <p style="margin:0; font-size:14px; line-height:22px; color:#3e4c59; white-space:pre-line;"
       th:text="${body}">Message body.</p>
</div>
</body>
</html>
