<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{email/_layout :: page(~{::content})}">
<body>
<div th:fragment="content" th:remove="tag">
    <h1 style="margin:0 0 12px; font-size:20px; color:#1f2933;">Your verification code</h1>
    <p style="margin:0 0 20px; font-size:14px; line-height:22px; color:#3e4c59;">
        Use the code below to complete your sign-in. Do not share it with anyone.
    </p>
    <p style="margin:0 0 20px; font-size:32px; font-weight:bold; letter-spacing:8px; color:#0b5394;"
       th:text="${otp}">123456</p>
    <p style="margin:0; font-size:13px; line-height:20px; color:#7b8794;">
        This code expires in <span th:text="${expiryMinutes}">5</span> minutes.
        If you did not request it, you can safely ignore this email.
    </p>
</div>
</body>
</html>
