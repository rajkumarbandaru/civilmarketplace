server:
  port: 8081

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:mysql://mysql:3306/civil_engineer_auth?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${AUTH_DB_USERNAME:civil_user}
    password: ${AUTH_DB_PASSWORD:civil_pass}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: 6379
      timeout: 2000ms

jwt:
  secret: ${JWT_SECRET:YXNkZmdoamtsOzk4NzY1NDMyMUBzZGZnamtsOTg3NjU0MzIxYXNkZmdoamts}
  access-token-expiration: 900000
  refresh-token-expiration: 2592000000

app:
  otp:
    expiry-minutes: 5
    length: 6
    resend-cooldown-seconds: 30
  oauth2:
    # First entry is where the tokens are delivered after a successful social login.
    # Override per environment (e.g. http://192.168.0.22:3000/oauth2/redirect on LAN).
    authorized-redirect-uris: ${OAUTH2_REDIRECT_URIS:http://localhost:3000/oauth2/redirect,https://app.civilengineer.com/oauth2/redirect}

eureka:
  instance:
    prefer-ip-address: true
    hostname: auth-service
  client:
    service-url:
      defaultZone: http://service-registry:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha

# ---------------------------------------------------------------------------
# Social login (Google / Facebook).
#
# Kept in its own profile on purpose: Spring rejects an empty client-id at
# startup, so registrations with unset credentials would break the service for
# everyone. Password and OTP login are unaffected when this profile is off.
#
# Enable with SPRING_PROFILES_ACTIVE=social once the credentials are set.
# Redirect URI to register with each provider:
#   {gateway-base}/login/oauth2/code/{google|facebook}
# ---------------------------------------------------------------------------
---
spring:
  config:
    activate:
      on-profile: social
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid,email,profile
            # Spring would otherwise derive this from auth-service's own host:port, which is
            # unreachable from the browser. It must be the gateway's public base URL, and must
            # match the redirect URI registered with the provider exactly.
            redirect-uri: ${OAUTH2_GATEWAY_BASE_URL:http://localhost:8080}/login/oauth2/code/google
          facebook:
            client-id: ${FACEBOOK_CLIENT_ID}
            client-secret: ${FACEBOOK_CLIENT_SECRET}
            scope: email,public_profile
            redirect-uri: ${OAUTH2_GATEWAY_BASE_URL:http://localhost:8080}/login/oauth2/code/facebook
        provider:
          facebook:
            # Spring's default Facebook user-info URI returns only id and name; the
            # email must be requested explicitly or CustomOAuth2UserService rejects
            # the login with "Email not provided by OAuth2 provider".
            user-info-uri: https://graph.facebook.com/me?fields=id,name,email,picture
