server:
  port: 8081

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:mysql://mysql:3306/civil_engineer_auth?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${AUTH_DB_USERNAME:civil_user}
    password: ${AUTH_DB_PASSWORD:civil_pass}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: 6379
      timeout: 2000ms

jwt:
  secret: ${JWT_SECRET:YXNkZmdoamtsOzk4NzY1NDMyMUBzZGZnamtsOTg3NjU0MzIxYXNkZmdoamts}
  access-token-expiration: 900000
  refresh-token-expiration: 2592000000

app:
  otp:
    expiry-minutes: 5
    length: 6
    resend-cooldown-seconds: 30
  oauth2:
    authorized-redirect-uris: http://localhost:3000/oauth2/redirect,https://app.civilengineer.com/oauth2/redirect

eureka:
  instance:
    prefer-ip-address: true
    hostname: auth-service
  client:
    service-url:
      defaultZone: http://service-registry:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
