server:
  port: 8100

spring:
  application:
    name: media-service
  datasource:
    url: jdbc:mysql://mysql:3306/civil_engineer_media?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${MEDIA_DB_USERNAME:civil_user}
    password: ${MEDIA_DB_PASSWORD:civil_pass}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    open-in-view: false
  flyway:
    # Off deliberately: tenant-common runs Flyway once per tenant schema. Boot's own Flyway would
    # migrate only the single legacy schema named in the datasource URL, where no tenant's data is.
    enabled: false
    baseline-on-migrate: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        "[interceptor.classes]": com.civileng.marketplace.tenant.common.TenantKafkaProducerInterceptor

eureka:
  instance:
    prefer-ip-address: true
    hostname: media-service
  client:
    service-url:
      defaultZone: http://service-registry:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

# Schema-per-tenant. Each tenant's rows live in civil_engineer_media_<tenantKey>; the schema named
# in the datasource URL is only the connection default and holds no live data once this is on.
platform:
  # Shared HTTP layer (web-common).
  web:
    admin-guard:
      enabled: false
  tenant:
    enabled: true
    schema-prefix: civil_engineer_media
    registry:
      url: jdbc:mysql://mysql:3306/civil_engineer_tenants?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      username: ${TENANT_DB_USERNAME:civil_user}
      password: ${TENANT_DB_PASSWORD:civil_pass}


# Object storage. MinIO locally; any S3-compatible store (AWS S3, R2, Wasabi) in production by
# changing these values alone. MEDIA_PUBLIC_ENDPOINT is the address a *browser* uses to reach the
# store — signed URLs are bound to it, so it must be the externally published host, not minio:9000.
media:
  storage:
    endpoint: ${MEDIA_STORAGE_ENDPOINT:http://minio:9000}
    public-endpoint: ${MEDIA_PUBLIC_ENDPOINT:http://localhost:9000}
    access-key: ${MEDIA_STORAGE_ACCESS_KEY:civeng-media}
    secret-key: ${MEDIA_STORAGE_SECRET_KEY:civeng-media-secret}
    region: ${MEDIA_STORAGE_REGION:us-east-1}
    public-bucket: ${MEDIA_PUBLIC_BUCKET:civeng-public}
    private-bucket: ${MEDIA_PRIVATE_BUCKET:civeng-private}
    upload-url-ttl: 10m
    download-url-ttl: 5m
    pending-ttl: 24h
