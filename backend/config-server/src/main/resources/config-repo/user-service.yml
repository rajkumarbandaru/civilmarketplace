server:
  port: 8082

spring:
  application:
    name: user-service
  datasource:
    url: jdbc:mysql://mysql:3306/civil_engineer_users?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${USER_DB_USERNAME:civil_user}
    password: ${USER_DB_PASSWORD:civil_pass}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        # Stamps the producing thread's tenant onto every record as an X-Tenant-Id header, which
        # the consuming side binds before the listener runs. Without it a consumer would write
        # into whichever schema happened to be the bootstrap tenant.
        "[interceptor.classes]": com.civileng.marketplace.tenant.common.TenantKafkaProducerInterceptor
  flyway:
    # Off deliberately: tenant-common runs Flyway once per tenant schema. Boot's own Flyway would
    # migrate only the single legacy schema named in the datasource URL, where no tenant's data is.
    enabled: false
    baseline-on-migrate: true
    locations: classpath:db/migration

eureka:
  instance:
    prefer-ip-address: true
    hostname: user-service
  client:
    service-url:
      defaultZone: http://service-registry:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

# Schema-per-tenant. Each tenant's rows live in civil_engineer_users_<tenantKey>; the schema named
# in the datasource URL is only the connection default and holds no live data once this is on.
platform:
  # Shared HTTP layer (web-common).
  web:
    admin-guard:
      enabled: true
      path-patterns:
        - "/api/v1/users/admin/**"
      # Read-only endpoints the background jobs call with no caller to propagate
      # (search-service's reindex sweep, notification-service's announcement job).
      # Safe: InternalOnlyPathFilter already seals this prefix from the gateway.
      exclude-path-patterns:
        - "/api/v1/users/admin/profiles"
        - "/api/v1/users/admin/profiles/*"
        - "/api/v1/users/admin/stats"
  tenant:
    enabled: true
    schema-prefix: civil_engineer_users
    registry:
      url: jdbc:mysql://mysql:3306/civil_engineer_tenants?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      username: ${TENANT_DB_USERNAME:civil_user}
      password: ${TENANT_DB_PASSWORD:civil_pass}

