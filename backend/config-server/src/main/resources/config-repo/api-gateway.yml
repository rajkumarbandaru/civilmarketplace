server:
  port: 8080

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: 6379
      timeout: 2000ms
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            # /login/oauth2/code/** is where the provider sends the user back; without it
            # the social login round-trip 404s at the gateway on the return leg.
            - Path=/api/v1/auth/**, /oauth2/**, /login/oauth2/code/**
          filters:
            - StripPrefix=0
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/v1/users/**
          filters:
            - StripPrefix=0
            - name: JwtAuth
        - id: booking-service
          uri: lb://booking-service
          predicates:
            - Path=/api/v1/bookings/**
          filters:
            - StripPrefix=0
            - name: JwtAuth
        - id: payment-service
          uri: lb://payment-service
          predicates:
            - Path=/api/v1/payments/**, /api/v1/wallets/**
          filters:
            - StripPrefix=0
            - name: JwtAuth
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/v1/notifications/**
          filters:
            - StripPrefix=0
            - name: JwtAuth
        # Both the reporter-facing and the staff paths, because SupportController and
        # AdminSupportController each read X-User-Id / X-User-Role — headers only the JwtAuth
        # filter sets. The discovery locator would route these by service id without it, and
        # every request would fail on a missing header rather than on a missing route.
        - id: support-service
          uri: lb://support-service
          predicates:
            - Path=/api/v1/support/**, /api/v1/admin/support/**
          filters:
            - StripPrefix=0
            - name: JwtAuth
      default-filters:
        # Downstream services (e.g. auth-service) set their own CORS headers, and the gateway
        # sets them again — browsers reject a response carrying two Access-Control-Allow-Origin
        # values ("contains multiple values, but only one is allowed"), which surfaces as a CORS
        # error in the UI even though curl sees a clean 200.
        - name: DedupeResponseHeader
          args:
            name: Access-Control-Allow-Origin Access-Control-Allow-Credentials
            strategy: RETAIN_UNIQUE
        - name: RequestRateLimiter
          args:
            redis-rate-limiter:
              replenishRate: 100
              burstCapacity: 200
              requestedTokens: 1
        - name: CircuitBreaker
          args:
            name: gatewayCircuitBreaker
            fallbackUri: forward:/fallback
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

jwt:
  secret: ${JWT_SECRET:YXNkZmdoamtsOzk4NzY1NDMyMUBzZGZnamtsOTg3NjU0MzIxYXNkZmdoamts}

eureka:
  instance:
    prefer-ip-address: true
    hostname: api-gateway
  client:
    service-url:
      defaultZone: http://service-registry:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,gateway
  endpoint:
    health:
      show-details: always
