server:
  port: 8102

spring:
  application:
    name: analytics-service
  # The warehouse: derived, shared, not tenant-scoped — one schema, every table keyed and
  # partitioned by tenant_key (architecture 02 §8). On the control-plane cluster.
  datasource:
    url: jdbc:mysql://mysql:3306/civil_engineer_warehouse?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&rewriteBatchedStatements=true
    username: ${WAREHOUSE_DB_USERNAME:civil_user}
    password: ${WAREHOUSE_DB_PASSWORD:civil_pass}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
  flyway:
    enabled: true
    locations: classpath:db/migration

eureka:
  instance:
    prefer-ip-address: true
    hostname: analytics-service
  client:
    service-url:
      defaultZone: http://service-registry:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

platform:
  web:
    admin-guard:
      enabled: false
  tenant:
    # Not a tenanted service: it reads every tenant's changes and keeps them apart by tenant_key.
    enabled: false
    registry:
      url: jdbc:mysql://mysql:3306/civil_engineer_tenants?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      username: ${TENANT_DB_USERNAME:civil_user}
      password: ${TENANT_DB_PASSWORD:civil_pass}

analytics:
  cdc:
    enabled: ${ANALYTICS_CDC_ENABLED:true}
    username: civil_cdc
    password: ${CDC_DB_PASSWORD:cdc_pass}
    # Replica server ids: base + the cluster's position in the placement map. Distinct from every
    # real replica's.
    server-id-base: 5400
  # Customer and payer ids reach the warehouse only as keyed pseudonyms (HMAC-SHA256).
  pseudonym-key: ${ANALYTICS_PSEUDONYM_KEY:}
