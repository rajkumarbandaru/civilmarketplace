server:
  port: 8083

spring:
  application:
    name: booking-service
  datasource:
    url: jdbc:mysql://mysql:3306/civil_engineer_bookings?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${BOOKING_DB_USERNAME:civil_user}
    password: ${BOOKING_DB_PASSWORD:civil_pass}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 30
      minimum-idle: 10
      idle-timeout: 300000
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    open-in-view: false
  flyway:
    # Off deliberately: tenant-common runs Flyway once per tenant schema. Boot's own Flyway would
    # migrate only the single legacy schema named in the datasource URL, where no tenant's data is.
    enabled: false
    baseline-on-migrate: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        # Stamps the producing thread's tenant onto every record as an X-Tenant-Id header, which
        # the consuming side binds before the listener runs. Without it a consumer would write
        # into whichever schema happened to be the bootstrap tenant.
        "[interceptor.classes]": com.civileng.marketplace.tenant.common.TenantKafkaProducerInterceptor
    consumer:
      group-id: booking-service-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # Wrapped in ErrorHandlingDeserializer so one unreadable record cannot wedge the partition.
      # Without it a single malformed message fails deserialization forever, and every genuine
      # event queued behind it — a payment confirmation included — is never delivered.
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: com.civileng.marketplace.*
        # These events are plain maps, so the payload is read by shape rather than by a __TypeId__
        # header naming a producer-side class the consumer does not share.
        spring.json.use.type.headers: false
        spring.json.value.default.type: java.util.LinkedHashMap
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: 6379
      timeout: 2000ms

resilience4j:
  circuitbreaker:
    instances:
      payment-service:
        register-health-indicator: true
        sliding-window-size: 10
        minimum-number-of-calls: 5
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        wait-duration-in-open-state: 5s
        failure-rate-threshold: 50
  retry:
    instances:
      payment-service:
        max-attempts: 3
        wait-duration: 1s
        retry-exceptions:
          - org.springframework.web.client.ResourceAccessException
  ratelimiter:
    instances:
      booking-api:
        limit-for-period: 100
        limit-refresh-period: 1s
        timeout-duration: 500ms

eureka:
  instance:
    prefer-ip-address: true
    hostname: booking-service
  client:
    service-url:
      defaultZone: http://service-registry:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

# Schema-per-tenant. Each tenant's rows live in civil_engineer_bookings_<tenantKey>; the schema named
# in the datasource URL is only the connection default and holds no live data once this is on.
platform:
  # Shared HTTP layer (web-common).
  web:
    # This service answers in its own body shape, which its callers already
    # depend on, so it keeps its own @RestControllerAdvice.
    error-handler: false
    admin-guard:
      enabled: true
      path-patterns:
        - "/api/v1/bookings/admin/**"
      # Read-only endpoints the background jobs call with no caller to propagate
      # (search-service's reindex sweep, notification-service's announcement job).
      # Safe: InternalOnlyPathFilter already seals this prefix from the gateway.
      exclude-path-patterns:
        - "/api/v1/bookings/admin/categories"
  tenant:
    enabled: true
    schema-prefix: civil_engineer_bookings
    registry:
      url: jdbc:mysql://mysql:3306/civil_engineer_tenants?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      username: ${TENANT_DB_USERNAME:civil_user}
      password: ${TENANT_DB_PASSWORD:civil_pass}

