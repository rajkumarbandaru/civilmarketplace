server:
  port: 8085

spring:
  application:
    name: notification-service
  datasource:
    url: jdbc:mysql://mysql:3306/civil_engineer_notifications?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${NOTIFICATION_DB_USERNAME:civil_user}
    password: ${NOTIFICATION_DB_PASSWORD:civil_pass}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    placeholder-replacement: false
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: 587
    username: ${SMTP_USERNAME:placeholder@gmail.com}
    password: ${SMTP_PASSWORD:placeholder}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    consumer:
      group-id: notification-service-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # Wrapped in ErrorHandlingDeserializer so one unreadable record cannot wedge the partition.
      # Without it a single malformed message fails deserialization forever, and every genuine
      # event queued behind it — a payment confirmation included — is never delivered.
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: com.civileng.marketplace.*
        # These events are plain maps, so the payload is read by shape rather than by a __TypeId__
        # header naming a producer-side class the consumer does not share.
        spring.json.use.type.headers: false
        spring.json.value.default.type: java.util.LinkedHashMap
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: 6379
      timeout: 2000ms
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: 5672
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}

app:
  # Every channel takes a provider of `log` (write the message to the service log, nothing
  # leaves the cluster) or its real provider. A real provider whose credentials are still the
  # `placeholder` default below degrades to logging rather than failing the send, so a
  # half-configured environment never breaks OTP login or booking flows.
  sms:
    provider: ${SMS_PROVIDER:twilio}
    sender-id: ${SMS_SENDER_ID:CIVILENG}
    # Accounts store bare national numbers; this is prepended to reach E.164 for Twilio.
    default-country-code: ${SMS_DEFAULT_COUNTRY_CODE:+91}
    twilio:
      account-sid: ${TWILIO_ACCOUNT_SID:placeholder}
      auth-token: ${TWILIO_AUTH_TOKEN:placeholder}
      phone-number: ${TWILIO_PHONE_NUMBER:+1234567890}
  whatsapp:
    provider: ${WHATSAPP_PROVIDER:twilio}
    sender-name: ${WHATSAPP_SENDER_NAME:Civil Engineer Marketplace}
    twilio:
      # Twilio's shared sandbox number; replace with your approved WhatsApp sender in prod.
      from-number: ${TWILIO_WHATSAPP_FROM:+14155238886}
  push:
    firebase:
      config-path: /etc/config/firebase-service-account.json
  email:
    provider: ${EMAIL_PROVIDER:smtp}
    # Relays reject any sender not verified on the account (Brevo, SendGrid and friends all
    # enforce this), so this has to be settable per environment rather than hardcoded.
    from-address: ${EMAIL_FROM_ADDRESS:noreply@civilengineer.com}
    from-name: ${EMAIL_FROM_NAME:Civil Engineer Marketplace}
    brevo:
      # Only used when provider=brevo. Unlike the SMTP relay this needs no separate login.
      api-key: ${BREVO_API_KEY:}
    templates:
      otp: otp-template
      welcome: welcome-template
      booking-confirmed: booking-confirmed-template
      payment-received: payment-received-template

eureka:
  instance:
    prefer-ip-address: true
    hostname: notification-service
  client:
    service-url:
      defaultZone: http://service-registry:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  health:
    # The mail indicator authenticates against the SMTP relay on every health poll, so a
    # relay we never send through still reports the service DOWN. With app.email.provider
    # set to brevo the HTTP API carries the mail and the relay is unused — enable this only
    # when actually running provider=smtp with a working SMTP_USERNAME/SMTP_PASSWORD pair.
    mail:
      enabled: ${SMTP_HEALTHCHECK_ENABLED:false}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
