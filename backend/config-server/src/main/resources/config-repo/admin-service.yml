# admin-service had no config-repo file, so it never picked up a Eureka service-url and was
# trying to register against the default localhost:8761 — it started, but nothing could route to
# it through the gateway. Everything the service already sets in its own application.yml is
# repeated here because config-server values win, and a partial file would silently drop the rest.
server:
  port: 8086

spring:
  application:
    name: admin-service
  servlet:
    multipart:
      # Site-content image uploads; kept above ContentService's own 2 MB cap so its message is
      # what an admin sees rather than a raw container error.
      max-file-size: 3MB
      max-request-size: 4MB
  datasource:
    url: jdbc:mysql://mysql:3306/admin_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${ADMIN_DB_USERNAME:civil_user}
    password: ${ADMIN_DB_PASSWORD:civil_pass}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    open-in-view: false
  flyway:
    # Off deliberately: tenant-common runs Flyway once per tenant schema. Boot's own Flyway would
    # migrate only the single legacy schema named in the datasource URL, where no tenant's data is.
    enabled: false
    baseline-on-migrate: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        # Stamps the producing thread's tenant onto every record as an X-Tenant-Id header, which
        # the consuming side binds before the listener runs. Without it a consumer would write
        # into whichever schema happened to be the bootstrap tenant.
        "[interceptor.classes]": com.civileng.marketplace.tenant.common.TenantKafkaProducerInterceptor

eureka:
  instance:
    prefer-ip-address: true
    hostname: admin-service
  client:
    service-url:
      defaultZone: http://service-registry:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

# Schema-per-tenant. Each tenant's rows live in admin_db_<tenantKey>; the schema named
# in the datasource URL is only the connection default and holds no live data once this is on.
platform:
  # Shared HTTP layer (web-common).
  web:
    # This service answers in its own body shape, which its callers already
    # depend on, so it keeps its own @RestControllerAdvice.
    error-handler: false
    admin-guard:
      enabled: true
      path-patterns:
        - "/api/v1/admin/**"
  tenant:
    enabled: true
    schema-prefix: admin_db
    registry:
      url: jdbc:mysql://mysql:3306/civil_engineer_tenants?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      username: ${TENANT_DB_USERNAME:civil_user}
      password: ${TENANT_DB_PASSWORD:civil_pass}

