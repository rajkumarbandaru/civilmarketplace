server:
  port: 8084

spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:mysql://mysql:3306/civil_engineer_payments?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${PAYMENT_DB_USERNAME:civil_user}
    password: ${PAYMENT_DB_PASSWORD:civil_pass}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 30
      minimum-idle: 10
      idle-timeout: 300000
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: payment-service-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.civileng.marketplace.*

escrow:
  # CP-06 FR-03's commission, as a percentage. Category-configurable by Super Admin is the
  # eventual shape; a single platform rate until admin-service owns per-category rates.
  commission-rate: ${ESCROW_COMMISSION_RATE:5.00}
  # FR-06's auto-release window: how long a funded hold waits for the payer before releasing.
  auto-release-days: ${ESCROW_AUTO_RELEASE_DAYS:7}
  auto-release-cron: ${ESCROW_AUTO_RELEASE_CRON:0 */10 * * * *}

razorpay:
  key-id: ${RAZORPAY_KEY_ID:rzp_test_placeholder}
  key-secret: ${RAZORPAY_KEY_SECRET:placeholder_secret}
  webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:whsec_placeholder}
  currency: INR
  payment-timeout-minutes: 30

app:
  platform-fee-percentage: 5.0
  gst-percentage: 18.0
  commission-rate: 10.0
  settlement:
    worker-payout-days: 7
    minimum-payout-amount: 100.00

eureka:
  instance:
    prefer-ip-address: true
    hostname: payment-service
  client:
    service-url:
      defaultZone: http://service-registry:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
