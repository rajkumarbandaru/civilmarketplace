server:
  port: 8101

spring:
  application:
    name: procurement-service
  cloud:
    config:
      enabled: true
      uri: http://config-server:8888
      fail-fast: true
      retry:
        initial-interval: 2000
        max-interval: 10000
        multiplier: 2
        max-attempts: 10
  config:
    import: optional:configserver:http://config-server:8888

logging:
  level:
    com.civileng.marketplace.procurement: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
