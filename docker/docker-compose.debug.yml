# Local debugging only: publishes the ports that docker-compose.yml deliberately does not.
#
# The base stack publishes only what a browser needs (gateway, frontend, nginx, MinIO API).
# Every service trusts the X-User-* / X-Tenant-Id headers the gateway sets, so a service port
# reachable from outside is a way to be anyone in any workspace; MySQL, Redis (no password),
# Kafka, Eureka and the config server (which serves secrets) are worse.
#
# This file puts them back for Swagger, an IDE-run service or a DB client, bound to 127.0.0.1 so
# they are reachable from this machine only:
#
#   docker compose -f docker-compose.yml -f docker-compose.lean.yml -f docker-compose.debug.yml up -d
#
# Never use it on a shared or deployed host.
services:
  mysql:
    ports:
      - "127.0.0.1:${HOST_PORT_MYSQL:-3306}:3306"
  mysql-b:
    ports:
      - "127.0.0.1:${HOST_PORT_MYSQL_B:-3307}:3306"
  redis:
    ports:
      - "127.0.0.1:${HOST_PORT_REDIS:-6381}:6379"
  minio:
    ports:
      - "127.0.0.1:${HOST_PORT_MINIO_CONSOLE:-9001}:9001"
  zookeeper:
    ports:
      - "127.0.0.1:2181:2181"
  kafka:
    ports:
      - "127.0.0.1:9092:9092"
      - "127.0.0.1:${HOST_PORT_KAFKA:-29093}:29092"
  rabbitmq:
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
  elasticsearch:
    ports:
      - "127.0.0.1:9200:9200"
      - "127.0.0.1:9300:9300"
