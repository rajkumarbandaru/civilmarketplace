# Pinned so the project identity does not follow the directory name. Without it Compose derives
# the project from the containing folder, and simply moving this file orphans every running
# container and named volume under the old name.
name: rajkumar

services:
  # ============================================================================
  # Infrastructure Services
  # ============================================================================

  mysql:
    image: mysql:8.0
    container_name: civil_mysql
    environment:
      CDC_DB_PASSWORD: ${CDC_DB_PASSWORD:-cdc_pass}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: civil_engineer_platform
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d
    networks:
      - civil-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --max_connections=500
      --innodb_buffer_pool_size=1G

  # A second MySQL cluster (cluster-b in tenant-service's placement map). Tenants are moved here
  # and back by the move controller; services open a pool to it the first time a tenant they
  # serve is placed on it. Same init scripts, so the same service accounts and grants; the
  # service password is set from .env like the first cluster's.
  mysql-b:
    image: mysql:8.0
    container_name: civil_mysql_b
    environment:
      CDC_DB_PASSWORD: ${CDC_DB_PASSWORD:-cdc_pass}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
      MYSQL_USER: civil_user
      MYSQL_PASSWORD: ${USER_DB_PASSWORD:-civil_pass}
    volumes:
      - mysql_b_data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d
    networks:
      - civil-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --max_connections=300
      --innodb_buffer_pool_size=256M
      --server-id=2

  redis:
    image: redis:7-alpine
    container_name: civil_redis
    volumes:
      - redis_data:/data
    networks:
      - civil-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # S3-compatible object storage for uploads. Pinned, and pulled from quay.io: MinIO no longer
  # publishes to Docker Hub. The API port must be reachable from browsers — uploads and downloads
  # go to it directly with signed URLs, never through the gateway.
  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: civil_minio
    command: server /data --console-address ":9001"
    ports:
      - "${HOST_PORT_MINIO:-9000}:9000"
    environment:
      - MINIO_ROOT_USER=${MEDIA_STORAGE_ACCESS_KEY:-civeng-media}
      - MINIO_ROOT_PASSWORD=${MEDIA_STORAGE_SECRET_KEY:-civeng-media-secret}
      # Browsers POST uploads cross-origin, from every tenant's subdomain.
      - MINIO_API_CORS_ALLOW_ORIGIN=${MEDIA_CORS_ALLOW_ORIGIN:-*}
    volumes:
      - minio_data:/data
    networks:
      - civil-network
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: civil_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    # Named, like kafka_data: Kafka's topic IDs live in both places and must stay in step. On the
    # image's anonymous volumes ZooKeeper started empty every time compose recreated it, while
    # Kafka kept its data — the IDs then disagreed and every consumer group stopped working.
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log:/var/lib/zookeeper/log
    networks:
      - civil-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: civil_kafka
    # A recreated broker can find its old ZooKeeper registration still alive for a few seconds
    # after an unclean stop, and exits with NodeExists; the retry succeeds once it lapses.
    restart: on-failure
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:${HOST_PORT_KAFKA:-29093}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - civil-network

  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: civil_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - civil-network

  elasticsearch:
    image: elasticsearch:8.11.0
    container_name: civil_elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - civil-network

  zipkin:
    image: openzipkin/zipkin:2.24
    container_name: civil_zipkin
    environment:
      - STORAGE_TYPE=mem
    networks:
      - civil-network

  prometheus:
    image: prom/prometheus:latest
    container_name: civil_prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - civil-network
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'

  grafana:
    image: grafana/grafana:latest
    container_name: civil_grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    networks:
      - civil-network
    depends_on:
      - prometheus

  # ============================================================================
  # Microservices
  # ============================================================================

  config-server:
    build:
      context: ..
      dockerfile: backend/config-server/Dockerfile
    container_name: civil_config_server
    networks:
      - civil-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8888/actuator/health > /dev/null"]
      interval: 30s
      timeout: 10s
      retries: 5

  service-registry:
    build:
      context: ..
      dockerfile: backend/service-registry/Dockerfile
    container_name: civil_service_registry
    networks:
      - civil-network
    depends_on:
      config-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8761/actuator/health > /dev/null"]
      interval: 30s
      timeout: 10s
      retries: 5

  api-gateway:
    build:
      context: ..
      dockerfile: backend/api-gateway/Dockerfile
    container_name: civil_api_gateway
    ports:
      - "${HOST_PORT_GATEWAY:-8080}:8080"
    environment:
      # Signs (gateway) and checks (services) forwarded identity. Empty stops the service at
      # startup with instructions, rather than letting it trust unsigned headers.
      - INTERNAL_SIGNING_KEY=${INTERNAL_SIGNING_KEY:-}
      - JWT_SECRET=${JWT_SECRET}
      - REDIS_HOST=redis
    networks:
      - civil-network
    depends_on:
      redis:
        condition: service_healthy
      service-registry:
        condition: service_healthy
      config-server:
        condition: service_healthy

  auth-service:
    build:
      context: ..
      dockerfile: backend/auth-service/Dockerfile
    container_name: civil_auth_service
    environment:
      # Signs (gateway) and checks (services) forwarded identity. Empty stops the service at
      # startup with instructions, rather than letting it trust unsigned headers.
      - INTERNAL_SIGNING_KEY=${INTERNAL_SIGNING_KEY:-}
      # Read at boot to learn which tenant schemas to migrate.
      - TENANT_DB_USERNAME=${TENANT_DB_USERNAME:-civil_user}
      - TENANT_DB_PASSWORD=${TENANT_DB_PASSWORD:-civil_pass}
      - AUTH_DB_USERNAME=${AUTH_DB_USERNAME:-civil_user}
      - AUTH_DB_PASSWORD=${AUTH_DB_PASSWORD:-civil_pass}
      - JWT_SECRET=${JWT_SECRET}
      - REDIS_HOST=redis
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      # "docker" activates DevUserSeeder's dummy accounts. Set to "" for a clean environment.
      # Add "social" (AUTH_PROFILE=docker,social) to turn on Google/Facebook login — it needs
      # real credentials below, since Spring refuses to start on an empty client-id.
      - SPRING_PROFILES_ACTIVE=${AUTH_PROFILE:-docker}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - FACEBOOK_CLIENT_ID=${FACEBOOK_CLIENT_ID:-}
      - FACEBOOK_CLIENT_SECRET=${FACEBOOK_CLIENT_SECRET:-}
      - OAUTH2_REDIRECT_URIS=${OAUTH2_REDIRECT_URIS:-http://localhost:3000/oauth2/redirect}
      - OAUTH2_GATEWAY_BASE_URL=${OAUTH2_GATEWAY_BASE_URL:-http://localhost:8080}
    networks:
      - civil-network
    depends_on:
      mysql:
        condition: service_started
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
      service-registry:
        condition: service_healthy
      config-server:
        condition: service_healthy

  user-service:
    build:
      context: ..
      dockerfile: backend/user-service/Dockerfile
    container_name: civil_user_service
    environment:
      # Signs (gateway) and checks (services) forwarded identity. Empty stops the service at
      # startup with instructions, rather than letting it trust unsigned headers.
      - INTERNAL_SIGNING_KEY=${INTERNAL_SIGNING_KEY:-}
      # Read at boot to learn which tenant schemas to migrate.
      - TENANT_DB_USERNAME=${TENANT_DB_USERNAME:-civil_user}
      - TENANT_DB_PASSWORD=${TENANT_DB_PASSWORD:-civil_pass}
      - USER_DB_USERNAME=${USER_DB_USERNAME:-civil_user}
      - USER_DB_PASSWORD=${USER_DB_PASSWORD:-civil_pass}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    networks:
      - civil-network
    depends_on:
      mysql:
        condition: service_started
      kafka:
        condition: service_started
      service-registry:
        condition: service_healthy
      config-server:
        condition: service_healthy

  booking-service:
    build:
      context: ..
      dockerfile: backend/booking-service/Dockerfile
    container_name: civil_booking_service
    environment:
      # Signs (gateway) and checks (services) forwarded identity. Empty stops the service at
      # startup with instructions, rather than letting it trust unsigned headers.
      - INTERNAL_SIGNING_KEY=${INTERNAL_SIGNING_KEY:-}
      # Read at boot to learn which tenant schemas to migrate.
      - TENANT_DB_USERNAME=${TENANT_DB_USERNAME:-civil_user}
      - TENANT_DB_PASSWORD=${TENANT_DB_PASSWORD:-civil_pass}
      - BOOKING_DB_USERNAME=${BOOKING_DB_USERNAME:-civil_user}
      - BOOKING_DB_PASSWORD=${BOOKING_DB_PASSWORD:-civil_pass}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - REDIS_HOST=redis
    networks:
      - civil-network
    depends_on:
      mysql:
        condition: service_started
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
      service-registry:
        condition: service_healthy
      config-server:
        condition: service_healthy

  payment-service:
    build:
      context: ..
      dockerfile: backend/payment-service/Dockerfile
    container_name: civil_payment_service
    environment:
      # Signs (gateway) and checks (services) forwarded identity. Empty stops the service at
      # startup with instructions, rather than letting it trust unsigned headers.
      - INTERNAL_SIGNING_KEY=${INTERNAL_SIGNING_KEY:-}
      # The secrets broker: this service's token, whose Vault policy says which tenant secrets it
      # may seal or open (docker/vault/policies/payment-service.hcl).
      - VAULT_ADDR=http://vault:8200
      - VAULT_TOKEN=${VAULT_TOKEN_PAYMENT_SERVICE:-}
      # Read at boot to learn which tenant schemas to migrate.
      - TENANT_DB_USERNAME=${TENANT_DB_USERNAME:-civil_user}
      - TENANT_DB_PASSWORD=${TENANT_DB_PASSWORD:-civil_pass}
      - PAYMENT_DB_USERNAME=${PAYMENT_DB_USERNAME:-civil_user}
      - PAYMENT_DB_PASSWORD=${PAYMENT_DB_PASSWORD:-civil_pass}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET}
      - RAZORPAY_WEBHOOK_SECRET=${RAZORPAY_WEBHOOK_SECRET}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    networks:
      - civil-network
    depends_on:
      mysql:
        condition: service_started
      kafka:
        condition: service_started
      service-registry:
        condition: service_healthy
      config-server:
        condition: service_healthy

  notification-service:
    build:
      context: ..
      dockerfile: backend/notification-service/Dockerfile
    container_name: civil_notification_service
    environment:
      # Signs (gateway) and checks (services) forwarded identity. Empty stops the service at
      # startup with instructions, rather than letting it trust unsigned headers.
      - INTERNAL_SIGNING_KEY=${INTERNAL_SIGNING_KEY:-}
      # The secrets broker: this service's token, whose Vault policy says which tenant secrets it
      # may seal or open (docker/vault/policies/notification-service.hcl).
      - VAULT_ADDR=http://vault:8200
      - VAULT_TOKEN=${VAULT_TOKEN_NOTIFICATION_SERVICE:-}
      # Read at boot to learn which tenant schemas to migrate.
      - TENANT_DB_USERNAME=${TENANT_DB_USERNAME:-civil_user}
      - TENANT_DB_PASSWORD=${TENANT_DB_PASSWORD:-civil_pass}
      - NOTIFICATION_DB_USERNAME=${NOTIFICATION_DB_USERNAME:-civil_user}
      - NOTIFICATION_DB_PASSWORD=${NOTIFICATION_DB_PASSWORD:-civil_pass}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN}
      - TWILIO_PHONE_NUMBER=${TWILIO_PHONE_NUMBER}
      - TWILIO_WHATSAPP_FROM=${TWILIO_WHATSAPP_FROM:-+14155238886}
      # Set any of these to `log` to keep that channel inside the cluster (messages are
      # written to the service log instead of being delivered).
      - EMAIL_PROVIDER=${EMAIL_PROVIDER:-smtp}
      - EMAIL_FROM_ADDRESS=${EMAIL_FROM_ADDRESS:-noreply@civilengineer.com}
      - EMAIL_FROM_NAME=${EMAIL_FROM_NAME:-Civil Engineer Marketplace}
      - BREVO_API_KEY=${BREVO_API_KEY:-}
      - SMS_PROVIDER=${SMS_PROVIDER:-twilio}
      - WHATSAPP_PROVIDER=${WHATSAPP_PROVIDER:-twilio}
      - SMS_SENDER_ID=${SMS_SENDER_ID:-CIVILENG}
      - SMS_DEFAULT_COUNTRY_CODE=${SMS_DEFAULT_COUNTRY_CODE:-+91}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - REDIS_HOST=redis
      - RABBITMQ_HOST=rabbitmq
    networks:
      - civil-network
    depends_on:
      mysql:
        condition: service_started
      kafka:
        condition: service_started
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      service-registry:
        condition: service_healthy
      config-server:
        condition: service_healthy

  admin-service:
    build:
      context: ..
      dockerfile: backend/admin-service/Dockerfile
    container_name: civil_admin_service
    environment:
      # Signs (gateway) and checks (services) forwarded identity. Empty stops the service at
      # startup with instructions, rather than letting it trust unsigned headers.
      - INTERNAL_SIGNING_KEY=${INTERNAL_SIGNING_KEY:-}
      # Read at boot to learn which tenant schemas to migrate.
      - TENANT_DB_USERNAME=${TENANT_DB_USERNAME:-civil_user}
      - TENANT_DB_PASSWORD=${TENANT_DB_PASSWORD:-civil_pass}
      - ADMIN_DB_USERNAME=${ADMIN_DB_USERNAME:-civil_user}
      - ADMIN_DB_PASSWORD=${ADMIN_DB_PASSWORD:-civil_pass}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    networks:
      - civil-network
    depends_on:
      mysql:
        condition: service_started
      kafka:
        condition: service_started
      service-registry:
        condition: service_healthy
      config-server:
        condition: service_healthy

  project-service:
    build:
      context: ..
      dockerfile: backend/project-service/Dockerfile
    container_name: civil_project_service
    environment:
      # Signs (gateway) and checks (services) forwarded identity. Empty stops the service at
      # startup with instructions, rather than letting it trust unsigned headers.
      - INTERNAL_SIGNING_KEY=${INTERNAL_SIGNING_KEY:-}
      # Read at boot to learn which tenant schemas to migrate.
      - TENANT_DB_USERNAME=${TENANT_DB_USERNAME:-civil_user}
      - TENANT_DB_PASSWORD=${TENANT_DB_PASSWORD:-civil_pass}
      - PROJECT_DB_USERNAME=${PROJECT_DB_USERNAME:-civil_user}
      - PROJECT_DB_PASSWORD=${PROJECT_DB_PASSWORD:-civil_pass}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    networks:
      - civil-network
    depends_on:
      mysql:
        condition: service_started
      kafka:
        condition: service_started
      service-registry:
        condition: service_healthy
      config-server:
        condition: service_healthy

  # The platform tenant registry. Every tenanted service reads this service's database at boot,
  # so it must be reachable before they start — but they read it over JDBC, not HTTP, so this
  # service is not in anyone's depends_on chain.
  tenant-service:
    build:
      context: ..
      dockerfile: backend/tenant-service/Dockerfile
    container_name: civil_tenant_service
    environment:
      # Signs (gateway) and checks (services) forwarded identity. Empty stops the service at
      # startup with instructions, rather than letting it trust unsigned headers.
      - INTERNAL_SIGNING_KEY=${INTERNAL_SIGNING_KEY:-}
      # The previous shared key: tenant-service alone keeps it, to read and re-seal secrets
      # stored before the broker. The services that use secrets open them only through Vault.
      - INTEGRATION_MASTER_KEY=${INTEGRATION_MASTER_KEY}
      # The secrets broker: this service's token, whose Vault policy says which tenant secrets it
      # may seal or open (docker/vault/policies/tenant-service.hcl).
      - VAULT_ADDR=http://vault:8200
      - VAULT_TOKEN=${VAULT_TOKEN_TENANT_SERVICE:-}
      - TENANT_DB_USERNAME=${TENANT_DB_USERNAME:-civil_user}
      - TENANT_DB_PASSWORD=${TENANT_DB_PASSWORD:-civil_pass}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      # Domain Manager: the ACME server and DNS for custom domains (Pebble and its test DNS locally;
      # acme://letsencrypt.org and the system resolver in production), and where certificates go.
      - PLATFORM_DOMAINS_ACME_DIRECTORY=${ACME_DIRECTORY:-acme://pebble/pebble:14000}
      - PLATFORM_DOMAINS_DNS_SERVER=${ACME_DNS_SERVER:-challtestsrv:8053}
      - PLATFORM_DOMAINS_CERT_DIRECTORY=/var/lib/platform/certs
    volumes:
      - tenant_certs:/var/lib/platform/certs
    networks:
      - civil-network
    depends_on:
      mysql:
        condition: service_started
      kafka:
        condition: service_started
      service-registry:
        condition: service_healthy
      config-server:
        condition: service_healthy

  support-service:
    build:
      context: ..
      dockerfile: backend/support-service/Dockerfile
    container_name: civil_support_service
    environment:
      # Signs (gateway) and checks (services) forwarded identity. Empty stops the service at
      # startup with instructions, rather than letting it trust unsigned headers.
      - INTERNAL_SIGNING_KEY=${INTERNAL_SIGNING_KEY:-}
      # The secrets broker: this service's token, whose Vault policy says which tenant secrets it
      # may seal or open (docker/vault/policies/support-service.hcl).
      - VAULT_ADDR=http://vault:8200
      - VAULT_TOKEN=${VAULT_TOKEN_SUPPORT_SERVICE:-}
      # Read at boot to learn which tenant schemas to migrate.
      - TENANT_DB_USERNAME=${TENANT_DB_USERNAME:-civil_user}
      - TENANT_DB_PASSWORD=${TENANT_DB_PASSWORD:-civil_pass}
      - SUPPORT_DB_USERNAME=${SUPPORT_DB_USERNAME:-civil_user}
      - SUPPORT_DB_PASSWORD=${SUPPORT_DB_PASSWORD:-civil_pass}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      # Ask AI. Unset is a supported state: the assistant reports itself unavailable and
      # ticketing carries on as normal.
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.6-flash}
      - GEMINI_FALLBACK_MODELS=${GEMINI_FALLBACK_MODELS:-gemini-3.5-flash,gemini-flash-latest}
      - AI_SITE_RATES_ENABLED=${AI_SITE_RATES_ENABLED:-true}
      - AI_SITE_RATES_CACHE_SECONDS=${AI_SITE_RATES_CACHE_SECONDS:-600}
      - AI_ASSISTANT_ENABLED=${AI_ASSISTANT_ENABLED:-true}
    networks:
      - civil-network
    depends_on:
      mysql:
        condition: service_started
      kafka:
        condition: service_started
      service-registry:
        condition: service_healthy
      config-server:
        condition: service_healthy

  review-service:
    build:
      context: ..
      dockerfile: backend/review-service/Dockerfile
    container_name: civil_review_service
    environment:
      # Signs (gateway) and checks (services) forwarded identity. Empty stops the service at
      # startup with instructions, rather than letting it trust unsigned headers.
      - INTERNAL_SIGNING_KEY=${INTERNAL_SIGNING_KEY:-}
      # Read at boot to learn which tenant schemas to migrate.
      - TENANT_DB_USERNAME=${TENANT_DB_USERNAME:-civil_user}
      - TENANT_DB_PASSWORD=${TENANT_DB_PASSWORD:-civil_pass}
      - REVIEW_DB_USERNAME=${REVIEW_DB_USERNAME:-civil_user}
      - REVIEW_DB_PASSWORD=${REVIEW_DB_PASSWORD:-civil_pass}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    networks:
      - civil-network
    depends_on:
      mysql:
        condition: service_started
      kafka:
        condition: service_started
      service-registry:
        condition: service_healthy
      config-server:
        condition: service_healthy

  media-service:
    build:
      context: ..
      dockerfile: backend/media-service/Dockerfile
    container_name: civil_media_service
    environment:
      # Signs (gateway) and checks (services) forwarded identity. Empty stops the service at
      # startup with instructions, rather than letting it trust unsigned headers.
      - INTERNAL_SIGNING_KEY=${INTERNAL_SIGNING_KEY:-}
      - TENANT_DB_USERNAME=${TENANT_DB_USERNAME:-civil_user}
      - TENANT_DB_PASSWORD=${TENANT_DB_PASSWORD:-civil_pass}
      - MEDIA_DB_USERNAME=${MEDIA_DB_USERNAME:-civil_user}
      - MEDIA_DB_PASSWORD=${MEDIA_DB_PASSWORD:-civil_pass}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - MEDIA_STORAGE_ENDPOINT=http://minio:9000
      # What a browser uses to reach MinIO; signed URLs are bound to this host.
      - MEDIA_PUBLIC_ENDPOINT=${MEDIA_PUBLIC_ENDPOINT:-http://localhost:9000}
      - MEDIA_STORAGE_ACCESS_KEY=${MEDIA_STORAGE_ACCESS_KEY:-civeng-media}
      - MEDIA_STORAGE_SECRET_KEY=${MEDIA_STORAGE_SECRET_KEY:-civeng-media-secret}
    networks:
      - civil-network
    depends_on:
      mysql:
        condition: service_started
      kafka:
        condition: service_started
      minio:
        condition: service_healthy
      service-registry:
        condition: service_healthy
      config-server:
        condition: service_healthy

  procurement-service:
    build:
      context: ..
      dockerfile: backend/procurement-service/Dockerfile
    container_name: civil_procurement_service
    environment:
      # Signs (gateway) and checks (services) forwarded identity. Empty stops the service at
      # startup with instructions, rather than letting it trust unsigned headers.
      - INTERNAL_SIGNING_KEY=${INTERNAL_SIGNING_KEY:-}
      - TENANT_DB_USERNAME=${TENANT_DB_USERNAME:-civil_user}
      - TENANT_DB_PASSWORD=${TENANT_DB_PASSWORD:-civil_pass}
      - PROCUREMENT_DB_USERNAME=${PROCUREMENT_DB_USERNAME:-civil_user}
      - PROCUREMENT_DB_PASSWORD=${PROCUREMENT_DB_PASSWORD:-civil_pass}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    networks:
      - civil-network
    depends_on:
      mysql:
        condition: service_started
      kafka:
        condition: service_started
      service-registry:
        condition: service_healthy
      config-server:
        condition: service_healthy

  # Change-data capture into the analytics warehouse (architecture 02 §8): follows every cluster's
  # binlog as a replica (the read-only civil_cdc account) and serves KPIs from the warehouse.
  analytics-service:
    build:
      context: ..
      dockerfile: backend/analytics-service/Dockerfile
    container_name: civil_analytics_service
    environment:
      - INTERNAL_SIGNING_KEY=${INTERNAL_SIGNING_KEY:-}
      - TENANT_DB_USERNAME=${TENANT_DB_USERNAME:-civil_user}
      - TENANT_DB_PASSWORD=${TENANT_DB_PASSWORD:-civil_pass}
      - WAREHOUSE_DB_USERNAME=${USER_DB_USERNAME:-civil_user}
      - WAREHOUSE_DB_PASSWORD=${USER_DB_PASSWORD:-civil_pass}
      - CDC_DB_PASSWORD=${CDC_DB_PASSWORD:-cdc_pass}
      - ANALYTICS_PSEUDONYM_KEY=${ANALYTICS_PSEUDONYM_KEY:-}
    networks:
      - civil-network
    depends_on:
      mysql:
        condition: service_started
      service-registry:
        condition: service_healthy
      config-server:
        condition: service_healthy

  audit-service:
    build:
      context: ..
      dockerfile: backend/audit-service/Dockerfile
    container_name: civil_audit_service
    environment:
      # Signs (gateway) and checks (services) forwarded identity. Empty stops the service at
      # startup with instructions, rather than letting it trust unsigned headers.
      - INTERNAL_SIGNING_KEY=${INTERNAL_SIGNING_KEY:-}
      # Read at boot to learn which tenant schemas to migrate.
      - TENANT_DB_USERNAME=${TENANT_DB_USERNAME:-civil_user}
      - TENANT_DB_PASSWORD=${TENANT_DB_PASSWORD:-civil_pass}
      - AUDIT_DB_USERNAME=${AUDIT_DB_USERNAME:-civil_user}
      - AUDIT_DB_PASSWORD=${AUDIT_DB_PASSWORD:-civil_pass}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    networks:
      - civil-network
    depends_on:
      mysql:
        condition: service_started
      kafka:
        condition: service_started
      service-registry:
        condition: service_healthy
      config-server:
        condition: service_healthy

  messaging-service:
    build:
      context: ..
      dockerfile: backend/messaging-service/Dockerfile
    container_name: civil_messaging_service
    environment:
      # Signs (gateway) and checks (services) forwarded identity. Empty stops the service at
      # startup with instructions, rather than letting it trust unsigned headers.
      - INTERNAL_SIGNING_KEY=${INTERNAL_SIGNING_KEY:-}
      # Read at boot to learn which tenant schemas to migrate.
      - TENANT_DB_USERNAME=${TENANT_DB_USERNAME:-civil_user}
      - TENANT_DB_PASSWORD=${TENANT_DB_PASSWORD:-civil_pass}
      - MESSAGING_DB_USERNAME=${MESSAGING_DB_USERNAME:-civil_user}
      - MESSAGING_DB_PASSWORD=${MESSAGING_DB_PASSWORD:-civil_pass}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    networks:
      - civil-network
    depends_on:
      mysql:
        condition: service_started
      kafka:
        condition: service_started
      service-registry:
        condition: service_healthy
      config-server:
        condition: service_healthy

  search-service:
    build:
      context: ..
      dockerfile: backend/search-service/Dockerfile
    container_name: civil_search_service
    environment:
      # Signs (gateway) and checks (services) forwarded identity. Empty stops the service at
      # startup with instructions, rather than letting it trust unsigned headers.
      - INTERNAL_SIGNING_KEY=${INTERNAL_SIGNING_KEY:-}
      - ELASTICSEARCH_URIS=http://elasticsearch:9200
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      # This service stores nothing in MySQL; the credentials are for reading the tenant registry,
      # which tells the reindex sweep which tenants' indices to rebuild.
      - TENANT_DB_USERNAME=${TENANT_DB_USERNAME:-civil_user}
      - TENANT_DB_PASSWORD=${TENANT_DB_PASSWORD:-civil_pass}
    networks:
      - civil-network
    depends_on:
      elasticsearch:
        condition: service_started
      mysql:
        condition: service_started
      kafka:
        condition: service_started
      service-registry:
        condition: service_healthy
      config-server:
        condition: service_healthy

  # ============================================================================
  # Frontend
  # ============================================================================

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
      # Vite inlines VITE_* into the bundle at build time, so this has to be a build arg. It was
      # previously listed under `environment:`, where it did nothing at all — nginx serves a
      # finished bundle and never reads it.
      args:
        # Empty on purpose: the bundle then calls /api/v1/... on its own origin and the frontend's
        # nginx proxies to the gateway with the Host header intact. A literal host here would pin
        # every tenant's traffic to one hostname, and the gateway resolves tenants by Host — so
        # acme.localhost and hostelfee.localhost would both resolve to the fallback tenant.
        VITE_API_BASE_URL: same-origin
        VITE_GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
    container_name: civil_frontend
    ports:
      - "${HOST_PORT_FRONTEND:-3000}:3000"
    networks:
      - civil-network
    depends_on:
      - api-gateway

  # ============================================================================
  # Reverse Proxy
  # ============================================================================

  # The secrets broker (architecture 06 §9): HashiCorp Vault's Transit engine holds one key per
  # (tenant, capability); services seal and open through it under per-service policies, and its
  # audit log records every open. See docker/vault/ for the bootstrap and the policies.
  vault:
    image: hashicorp/vault:1.17
    container_name: civil_vault
    entrypoint: ["/bin/sh", "/vault/bootstrap/bootstrap.sh"]
    environment:
      - VAULT_TOKEN_TENANT_SERVICE=${VAULT_TOKEN_TENANT_SERVICE:-}
      - VAULT_TOKEN_PAYMENT_SERVICE=${VAULT_TOKEN_PAYMENT_SERVICE:-}
      - VAULT_TOKEN_NOTIFICATION_SERVICE=${VAULT_TOKEN_NOTIFICATION_SERVICE:-}
      - VAULT_TOKEN_SUPPORT_SERVICE=${VAULT_TOKEN_SUPPORT_SERVICE:-}
    volumes:
      - vault_data:/vault/file
      - vault_logs:/vault/logs
      - ./vault:/vault/bootstrap:ro
    networks:
      - civil-network
    healthcheck:
      test: ["CMD", "test", "-f", "/vault/file/bootstrap/ready"]
      interval: 5s
      timeout: 3s
      retries: 30

  # Local stand-ins for the ACME certificate authority (Let's Encrypt) and for tenants' DNS, used
  # by the Domain Manager (tenant-service) for custom domains. Pebble validates HTTP-01 over port 80
  # of the domain as challtestsrv resolves it; the drill publishes records through challtestsrv's
  # management API as a tenant would at their DNS provider. Production points tenant-service at
  # acme://letsencrypt.org and the public DNS instead, and runs neither.
  pebble:
    image: ghcr.io/letsencrypt/pebble:latest
    container_name: civil_pebble
    command: ["-config", "/config/pebble-config.json", "-dnsserver", "challtestsrv:8053"]
    environment:
      - PEBBLE_VA_NOSLEEP=1
      - PEBBLE_WFE_NONCEREJECT=0
    volumes:
      - ./pebble/pebble-config.json:/config/pebble-config.json:ro
    ports:
      - "127.0.0.1:${HOST_PORT_PEBBLE_MGMT:-15000}:15000"
    networks:
      - civil-network
    depends_on:
      - challtestsrv

  challtestsrv:
    image: ghcr.io/letsencrypt/pebble-challtestsrv:latest
    container_name: civil_challtestsrv
    # Answers only the records the drill adds; nothing else resolves.
    command: ["-defaultIPv4", "", "-defaultIPv6", "", "-http01", "", "-https01", "", "-tlsalpn01", "", "-doh", ""]
    ports:
      - "127.0.0.1:${HOST_PORT_CHALLTESTSRV:-8055}:8055"
    networks:
      - civil-network

  nginx:
    image: nginx:alpine
    container_name: civil_nginx
    ports:
      - "${HOST_PORT_NGINX:-8010}:80"
      - "${HOST_PORT_NGINX_SSL:-8443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/sites:/etc/nginx/sites-enabled
      - ./nginx/ssl:/etc/nginx/ssl
      # Custom-domain certificates written by tenant-service's Domain Manager.
      - tenant_certs:/etc/nginx/tenant-certs:ro
    networks:
      - civil-network
    depends_on:
      - api-gateway
      - frontend

networks:
  civil-network:
    driver: bridge

volumes:
  vault_data:
  vault_logs:
  tenant_certs:
  mysql_b_data:
  mysql_data:
  minio_data:
  redis_data:
  kafka_data:
  zookeeper_data:
  zookeeper_log:
  rabbitmq_data:
  elasticsearch_data:
  prometheus_data:
  grafana_data:
