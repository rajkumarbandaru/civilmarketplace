user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main buffer=32k;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 100M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=20r/m;

    # Upstreams
    # Containers get a new address when they are recreated (every deploy): resolve the upstreams
    # through Docker's DNS continuously instead of once at startup, or the edge keeps sending to an
    # address that no longer exists (502) until it is restarted.
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream api_gateway {
        zone api_gateway 64k;
        server api-gateway:8080 resolve;
        keepalive 64;
    }

    upstream frontend {
        zone frontend 64k;
        server frontend:3000 resolve;
        keepalive 64;
    }

    # Server block
    # ---------------------------------------------------------------- tenants' custom domains
    # Hosts verified and certified by tenant-service's Domain Manager. Their certificates are on
    # the tenant_certs volume as <host>.crt / <host>.key and are chosen per handshake by SNI, so a new
    # domain needs no reload. Only plain host names are looked up (no path tricks through SNI).
    map $ssl_server_name $tenant_cert_host {
        "~^[a-z0-9][a-z0-9.-]{0,252}$" $ssl_server_name;
        default                        "no-such-host";
    }

    server {
        listen 80 default_server;
        server_name _;
        # The certificate authority's HTTP-01 check, answered by tenant-service via the gateway.
        location /.well-known/acme-challenge/ {
            proxy_pass http://api_gateway;
            proxy_set_header Host $host;
        }
        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl http2 default_server;
        server_name _;
        ssl_certificate /etc/nginx/tenant-certs/$tenant_cert_host.crt;
        ssl_certificate_key /etc/nginx/tenant-certs/$tenant_cert_host.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # The tenant's site and app; the frontend proxies /api with this Host, so the gateway
        # resolves the tenant from its custom domain.
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }

    server {
        listen 80;
        server_name localhost api.civilengineer.com app.civilengineer.com;
        return 301 https://$server_name$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name api.civilengineer.com;

        ssl_certificate /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location / {
            proxy_pass http://api_gateway;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 90s;

            limit_req zone=api burst=200 nodelay;
        }

        location /ws {
            proxy_pass http://api_gateway;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 86400s;
        }
    }

    server {
        listen 443 ssl http2;
        server_name app.civilengineer.com;

        ssl_certificate /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        root /usr/share/nginx/html;
        index index.html;

        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /static/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}
